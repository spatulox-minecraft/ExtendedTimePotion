name: New Minecraft version

# Detects a new Minecraft release, proves the mod on every version the new range
# claims, and opens a pull request. The pipeline lives in mc-bump; the schedule
# does NOT — auto-update.yml is workflow_call only, so the cron has to be here.

on:
  schedule:
    # Wednesday 06:00 UTC, aligned with Mojang's release rhythm
    - cron: '0 6 * * 3'
  workflow_dispatch:
    inputs:
      minecraft-version:
        description: "Force a specific Minecraft version (e.g. 26.2). Empty = latest release."
        required: false
        type: string
      force:
        description: "Continue even if the repo is already on that version"
        required: false
        type: boolean
        default: false

# issues: write is needed both to open the failure issue and to create the
# minecraft-update label (gh pr create --label fails when the label is missing).
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    uses: spatulox-minecraft/mc-bump/.github/workflows/auto-update.yml@v1
    with:
      # `inputs` is null on a scheduled run: the version resolves to the empty
      # string (latest release) and force to its default.
      minecraft-version: ${{ inputs.minecraft-version }}
      force: ${{ inputs.force || false }}
    secrets: inherit
