name: "[mc-bump] CI"

# TEST HARNESS — lives on the test/mc-bump branch only.
#
# Deliberately named differently from ci.yml and triggered only by hand, so the
# existing pipeline keeps running untouched next to it. That is the point: the
# two can run on the same commit and be compared, instead of one replacing the
# other before it has ever proven anything.
#
# `mc-bump-ref: main` because the released tag does not exist yet. Switch it to
# v1 once mc-bump is tagged.

on:
  workflow_dispatch:
    inputs:
      mc-bump-ref:
        description: Which mc-bump ref to run (branch, tag or SHA).
        type: string
        default: main

permissions:
  contents: read
  issues: write

concurrency:
  group: mcbump-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: spatulox-minecraft/mc-bump/.github/workflows/ci.yml@main
    with:
      mc-bump-ref: ${{ inputs.mc-bump-ref }}
    secrets: inherit
