name: CI

# Everything this pipeline does lives in mc-bump; what it does it to THIS mod is
# described by .github/mc-bump.yml, and nowhere else.
#
# Three independent kinds of test, three jobs, so a red one names itself:
# unit tests (JUnit), the version matrix (build + boot a server, one job per
# claimed Minecraft version) and the client gametest.
#
# @v1 is the major version pointer: it moves forward with mc-bump's backward
# compatible changes, so a fix there reaches this mod without a commit here.
# Pin a tag or a SHA instead if that is ever not what you want.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# issues: write — the failure report opens (or comments on) an issue.
permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: spatulox-minecraft/mc-bump/.github/workflows/ci.yml@v1
    secrets: inherit
