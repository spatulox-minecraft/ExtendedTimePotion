name: Release

# Publishes the mod to Modrinth and CurseForge once a new version lands on
# master, then tags the commit and creates the GitHub release from that tag.
# Each store publishes in its own, individually replayable job — a marker tag
# per store is what makes a re-run skip what is already out there.
#
# The trigger is mod_version, not "the claimed versions grew": the tag carries
# mod_version, so it is the only field that guarantees a unique name, and it
# covers a manual release (1.1.0 -> 1.2.0 with no Minecraft change) too. Hence
# the paths filter: a push touching only the README republishes nothing.

on:
  push:
    branches: [master]
    paths:
      - gradle.properties
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Do everything except the uploads and the tag"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  release:
    uses: spatulox-minecraft/mc-bump/.github/workflows/release.yml@v1
    with:
      dry-run: ${{ inputs.dry-run || false }}
    secrets: inherit
